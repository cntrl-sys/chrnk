<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Image Progression</title>
  <style>
    /* ── Reset & Base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white:   #ffffff;
      --off:     #f5f2ed;
      --beige:   #e8e0d4;
      --beige-d: #c9bfb0;
      --black:   #111110;
      --ink:     #2a2a28;
      --muted:   #888880;

      --radius:  14px;
      --shadow:  0 2px 12px rgba(0,0,0,.07), 0 1px 3px rgba(0,0,0,.05);
      --shadow-h:0 6px 28px rgba(0,0,0,.11), 0 2px 6px rgba(0,0,0,.07);

      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body:    'DM Sans', system-ui, sans-serif;
    }

    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap');

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--off);
      color: var(--ink);
      min-height: 100vh;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ────────────────────────────────────────────────── */
    header {
      background: var(--white);
      border-bottom: 1px solid var(--beige);
      padding: 2.5rem 2rem 2rem;
      text-align: center;
    }

    .site-label {
      font-size: .72rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .9rem;
      font-weight: 400;
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 300;
      color: var(--black);
      line-height: 1.1;
      letter-spacing: -.01em;
    }

    .subtitle {
      margin-top: .7rem;
      color: var(--muted);
      font-size: .88rem;
      font-weight: 300;
    }

    /* ── Filter bar ────────────────────────────────────────────── */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: .5rem;
      margin-top: 1.6rem;
    }

    .filter-btn {
      font-family: var(--font-body);
      font-size: .72rem;
      font-weight: 400;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--off);
      border: 1px solid var(--beige);
      border-radius: 999px;
      padding: .35rem .9rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-btn:hover {
      border-color: var(--beige-d);
      color: var(--ink);
    }

    .filter-btn.active {
      background: var(--black);
      border-color: var(--black);
      color: var(--white);
    }

    .card.hidden { display: none; }

    /* ── Grid ──────────────────────────────────────────────────── */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 1.5rem 5rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    /* ── Card ──────────────────────────────────────────────────── */
    .card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .card:hover {
      box-shadow: var(--shadow-h);
      border-color: var(--beige);
    }

    .card.open {
      grid-column: 1 / -1;        /* span full row when expanded */
      cursor: default;
    }

    /* ── Card Header ───────────────────────────────────────────── */
    .card-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.2rem;
      border-bottom: 1px solid var(--beige);
      cursor: pointer;
    }

    .card.open .card-header {
      border-bottom-color: var(--beige);
    }

    .card-thumb {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--beige);
    }

    .card-thumb-placeholder {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      flex-shrink: 0;
      background: var(--beige);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .65rem;
      color: var(--muted);
      letter-spacing: .08em;
    }

    .card-meta { flex: 1; min-width: 0; }

    .card-title {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 400;
      color: var(--black);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-steps {
      font-size: .72rem;
      color: var(--muted);
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-top: .2rem;
    }

    .card-author {
      font-size: .72rem;
      color: var(--muted);
      margin-top: .15rem;
    }

    .card-toggle {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--off);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--muted);
      font-size: .75rem;
    }

    .card.open .card-toggle { background: var(--black); color: var(--white); }

    /* ── Cover (collapsed) ─────────────────────────────────────── */
    .card-cover {
      position: relative;
      overflow: hidden;
    }

    .card-cover img {
      width: 100%;
      aspect-ratio: 16/10;
      object-fit: cover;
      display: block;
      background: var(--beige);
    }

    .card-cover-placeholder {
      width: 100%;
      aspect-ratio: 16/10;
      background: var(--beige);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cover-badge {
      position: absolute;
      bottom: .75rem;
      left: .75rem;
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(6px);
      border-radius: 6px;
      padding: .22rem .6rem;
      font-size: .68rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--ink);
    }

    /* ── Expanded content ──────────────────────────────────────── */
    .card-body {
      display: none;
      padding: 1.8rem 1.8rem 2rem;
    }

    .card.open .card-body { display: block; }
    .card.open .card-cover { display: none; }

    /* ── Step strip ────────────────────────────────────────────── */
    .steps-label {
      font-size: .7rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.2rem;
    }

    /* Horizontal flex row, scrolls if too many images */
    .steps-strip {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: flex-end;
      gap: 0;
      overflow-x: auto;
      padding-bottom: .5rem;
      /* hide scrollbar on webkit but keep functional */
      scrollbar-width: thin;
      scrollbar-color: var(--beige-d) transparent;
    }
    .steps-strip::-webkit-scrollbar { height: 4px; }
    .steps-strip::-webkit-scrollbar-track { background: transparent; }
    .steps-strip::-webkit-scrollbar-thumb { background: var(--beige-d); border-radius: 2px; }

    .step-item {
      display: flex;
      flex-direction: column;
      gap: .5rem;
      flex: 0 0 auto;          /* never shrink, never grow */
      width: 180px;
    }

    .step-item.is-final {
      width: 220px;             /* final image slightly wider */
    }

    .step-img-wrap {
      border-radius: 10px;
      overflow: hidden;
      background: var(--beige);
      position: relative;
      cursor: zoom-in;
    }

    /* start */
    .step-item.is-start .step-img-wrap {
      outline: 2px solid var(--black);
      outline-offset: 2px;
    }

    .step-img-wrap img {
      width: 100%;
      aspect-ratio: 16/11;
      object-fit: cover;
      display: block;
    }

    /* final image taller */
    .step-item.is-final .step-img-wrap img { aspect-ratio: 4/3; }

    .step-img-placeholder {
      width: 100%;
      aspect-ratio: 16/11;
      background: var(--beige);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .65rem;
      color: var(--muted);
    }

    .step-badge {
      font-size: .62rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .step-item.is-start .step-badge,
    .step-item.is-final .step-badge {
      color: var(--black);
      font-weight: 500;
    }

    /* connector arrow — sits between step-items, self-aligned to center */
    .step-arrow {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      color: var(--beige-d);
      font-size: 1rem;
      /* visually center the arrow relative to image height */
      padding-bottom: 1.6rem;
      align-self: center;
    }

    /* ── Lightbox ──────────────────────────────────────────────── */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(17,17,16,.92);
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    #lightbox.active { display: flex; }

    #lightbox-img {
      max-width: 90vw;
      max-height: 88vh;
      border-radius: 10px;
      object-fit: contain;
      display: block;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }

    #lightbox-close {
      position: fixed;
      top: 1.2rem;
      right: 1.4rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,.12);
      border: none;
      cursor: pointer;
      color: var(--white);
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #lightbox-close:hover { background: rgba(255,255,255,.22); }

    #lightbox-caption {
      position: fixed;
      bottom: 1.4rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: .7rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(255,255,255,.45);
    }

    /* nav arrows */
    .lb-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,.1);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      color: var(--white);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lb-nav:hover { background: rgba(255,255,255,.2); }
    #lb-prev { left: 1rem; }
    #lb-next { right: 1rem; }

    /* ── Footer ────────────────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 2rem;
      font-size: .75rem;
      color: var(--beige-d);
      border-top: 1px solid var(--beige);
      background: var(--white);
      letter-spacing: .06em;
    }

    /* ── Responsive ────────────────────────────────────────────── */
    @media (max-width: 600px) {
      header { padding: 1.8rem 1rem 1.4rem; }
      main   { padding: 1.5rem 1rem 3rem; }
      .steps-strip { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: .7rem; }
      .card-body { padding: 1.2rem 1rem 1.4rem; }
    }
  </style>
</head>

<header>
  <p class="site-label">AI Image Studio</p>
  <h1>Generierungsverläufe</h1>
  <p class="subtitle">Vom ersten Rauschen bis zum finalen Bild — Schritt für Schritt.</p>
  <div class="filter-bar" id="filter-bar"></div>
</header>

<main>
  <div class="grid" id="gallery"></div>
</main>

</div>

<footer>AI Image Progression Gallery &nbsp;·&nbsp; Vanilla HTML/CSS/JS</footer>

/* ─────────────────────────────────────────────────────────────────
   LIGHTBOX STATE
───────────────────────────────────────────────────────────────── */
let lbImages  = [];   // current set's image array
let lbIndex   = 0;    // currently shown index

const lightbox   = document.getElementById('lightbox');
const lbImg      = document.getElementById('lightbox-img');
const lbCaption  = document.getElementById('lightbox-caption');
const lbClose    = document.getElementById('lightbox-close');
const lbPrev     = document.getElementById('lb-prev');
const lbNext     = document.getElementById('lb-next');

function lbShow(images, index) {
  lbImages = images;
  lbIndex  = index;
  lbRender();
  lightbox.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function lbHide() {
  lightbox.classList.remove('active');
  document.body.style.overflow = '';
}

function lbRender() {
  const total = lbImages.length;
  lbImg.src = lbImages[lbIndex];
  lbImg.alt = stepLabel(lbIndex, total);
  lbCaption.textContent = `${stepLabel(lbIndex, total)}  ·  ${lbIndex + 1} / ${total}`;
  lbPrev.style.opacity = lbIndex === 0 ? '.3' : '1';
  lbNext.style.opacity = lbIndex === total - 1 ? '.3' : '1';
}

lbClose.addEventListener('click', lbHide);
lbPrev.addEventListener('click', () => { if (lbIndex > 0) { lbIndex--; lbRender(); } });
lbNext.addEventListener('click', () => { if (lbIndex < lbImages.length - 1) { lbIndex++; lbRender(); } });

lightbox.addEventListener('click', e => { if (e.target === lightbox) lbHide(); });

document.addEventListener('keydown', e => {
  if (!lightbox.classList.contains('active')) return;
  if (e.key === 'Escape')      lbHide();
  if (e.key === 'ArrowLeft'  && lbIndex > 0)                  { lbIndex--; lbRender(); }
  if (e.key === 'ArrowRight' && lbIndex < lbImages.length - 1){ lbIndex++; lbRender(); }
});

/* ─────────────────────────────────────────────────────────────────
   HELPERS
───────────────────────────────────────────────────────────────── */
function stepLabel(index, total) {
  if (index === 0)         return "Start";
  if (index === total - 1) return "Final";
  return `Schritt ${index}`;
}

/* ─────────────────────────────────────────────────────────────────
   BUILD DOM
───────────────────────────────────────────────────────────────── */
function buildCard(set, cardIdx) {
  const { title, images, author } = set;
  const total    = images.length;
  const startSrc = images[0];
  const stepsText = total === 1 ? "1 Bild" : `${total} Schritte`;

  /* — card element — */
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.index  = cardIdx;
  card.dataset.author = author || '';

  /* — header — */
  const header = document.createElement('div');
  header.className = 'card-header';

  /* thumb */
  if (startSrc) {
    const thumb = document.createElement('img');
    thumb.className = 'card-thumb';
    thumb.src = startSrc;
    thumb.alt = 'Thumb';
    thumb.onerror = function() {
      const ph = document.createElement('div');
      ph.className = 'card-thumb-placeholder';
      ph.textContent = 'IMG';
      this.replaceWith(ph);
    };
    header.appendChild(thumb);
  } else {
    const ph = document.createElement('div');
    ph.className = 'card-thumb-placeholder';
    ph.textContent = 'IMG';
    header.appendChild(ph);
  }

  const meta = document.createElement('div');
  meta.className = 'card-meta';
  const authorLine = author
    ? `<div class="card-author">${author}</div>`
    : '';
  meta.innerHTML = `<div class="card-title">${title}</div>
                    ${authorLine}
                    <div class="card-steps">${stepsText}</div>`;
  header.appendChild(meta);

  const toggle = document.createElement('div');
  toggle.className = 'card-toggle';
  toggle.innerHTML = '&#43;';
  header.appendChild(toggle);

  /* — cover — */
  const cover = document.createElement('div');
  cover.className = 'card-cover';
  if (startSrc) {
    const coverImg = document.createElement('img');
    coverImg.src = startSrc;
    coverImg.alt = `Start – ${title}`;
    coverImg.onerror = function() {
      const ph = document.createElement('div');
      ph.className = 'card-cover-placeholder';
      this.replaceWith(ph);
    };
    cover.appendChild(coverImg);
  } else {
    const ph = document.createElement('div');
    ph.className = 'card-cover-placeholder';
    cover.appendChild(ph);
  }
  const badge = document.createElement('span');
  badge.className = 'cover-badge';
  badge.textContent = 'Start';
  cover.appendChild(badge);

  /* — body — */
  const body = document.createElement('div');
  body.className = 'card-body';

  const label = document.createElement('p');
  label.className = 'steps-label';
  label.innerHTML = `${stepsText} &nbsp;·&nbsp; ${title}`;
  body.appendChild(label);

  const strip = document.createElement('div');
  strip.className = 'steps-strip';

  images.forEach((src, i) => {
    const isStart = i === 0;
    const isFinal = i === total - 1;
    const lbl     = stepLabel(i, total);
    const cls     = isStart ? 'is-start' : isFinal ? 'is-final' : 'is-mid';

    /* arrow separator */
    if (i > 0) {
      const arrow = document.createElement('div');
      arrow.className = 'step-arrow';
      arrow.innerHTML = '&#8250;';
      strip.appendChild(arrow);
    }

    /* step item */
    const item = document.createElement('div');
    item.className = `step-item ${cls}`;

    const wrap = document.createElement('div');
    wrap.className = 'step-img-wrap';

    if (src) {
      const img = document.createElement('img');
      img.src = src;
      img.alt = lbl;
      img.loading = 'lazy';
      img.onerror = function() {
        const ph = document.createElement('div');
        ph.className = 'step-img-placeholder';
        ph.textContent = lbl;
        this.replaceWith(ph);
      };
      /* lightbox on click */
      img.addEventListener('click', e => {
        e.stopPropagation();
        lbShow(images, i);
      });
      wrap.appendChild(img);
    } else {
      const ph = document.createElement('div');
      ph.className = 'step-img-placeholder';
      ph.textContent = lbl;
      wrap.appendChild(ph);
    }

    const stepBadge = document.createElement('span');
    stepBadge.className = 'step-badge';
    stepBadge.textContent = lbl;

    item.appendChild(wrap);
    item.appendChild(stepBadge);
    strip.appendChild(item);
  });

  body.appendChild(strip);

  /* — assemble — */
  card.appendChild(header);
  card.appendChild(cover);
  card.appendChild(body);

  /* — toggle interaction — */
  function doToggle(e) {
    if (card.classList.contains('open') && e.target.closest('.card-body')) return;
    const isOpen = card.classList.toggle('open');
    toggle.innerHTML = isOpen ? '&#8722;' : '&#43;';
    if (isOpen) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  card.addEventListener('click', doToggle);
  return card;
}

/* ─────────────────────────────────────────────────────────────────
   RENDER CARDS
───────────────────────────────────────────────────────────────── */
const gallery   = document.getElementById('gallery');
const filterBar = document.getElementById('filter-bar');
const cardEls   = [];

imageSets.forEach((set, idx) => {
  const card = buildCard(set, idx);
  gallery.appendChild(card);
  cardEls.push(card);
});

/* ─────────────────────────────────────────────────────────────────
   FILTER LOGIC
───────────────────────────────────────────────────────────────── */
// Collect unique authors in order of appearance, skip blanks
const authors = [...new Set(imageSets.map(s => s.author).filter(Boolean))];

let activeFilter = null; // null = show all

function applyFilter(name) {
  activeFilter = name;
  cardEls.forEach(card => {
    const match = !name || card.dataset.author === name;
    card.classList.toggle('hidden', !match);
    // close expanded cards that become hidden
    if (!match && card.classList.contains('open')) {
      card.classList.remove('open');
      card.querySelector('.card-toggle').innerHTML = '&#43;';
    }
  });
  // update button states
  filterBar.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.filter === (name || '__all__'));
  });
}

// Build filter buttons only if there are authors
if (authors.length > 0) {
  // "Alle" button
  const allBtn = document.createElement('button');
  allBtn.className = 'filter-btn active';
  allBtn.dataset.filter = '__all__';
  allBtn.textContent = 'Alle';
  allBtn.addEventListener('click', () => applyFilter(null));
  filterBar.appendChild(allBtn);

  authors.forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.filter = name;
    btn.textContent = name;
    btn.addEventListener('click', () => applyFilter(name));
    filterBar.appendChild(btn);
  });
}
